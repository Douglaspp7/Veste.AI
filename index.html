<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Veste.AI — Provador Virtual</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Veste.AI">

  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <video id="camera" autoplay playsinline></video>
    <canvas id="overlay"></canvas>

    <div id="status-bar">
      <span id="status">Toque para ativar a câmera</span>
    </div>

    <div id="controls">
      <h1>Veste.AI 👗</h1>
      <button id="start">📸 Ativar Câmera</button>
      <button id="flip">🔄 Virar Câmera</button>
    </div>
  </div>
  <script type="module" src="/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
</body>
</html>
